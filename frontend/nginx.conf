server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real static file falls back to index.html so React
    # Router's client-side routes (e.g. a deep link to /transactions) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's default) are safe to cache forever; index.html must not be,
    # or a deploy's new asset references would keep resolving against a stale cached shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
