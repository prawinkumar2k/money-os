services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/money-os
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173,https://localhost,capacitor://localhost
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-change-me-too}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-32-byte-key-change-me}
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
